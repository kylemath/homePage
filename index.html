<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function(){try{var s=localStorage.getItem("theme");var t=s==="light"||s==="dark"?s:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t)}catch(e){}})();
    (function(){try{var h=location.hostname;if(!h||h==="localhost"||h==="127.0.0.1"||h==="::1"||h==="[::1]"||h.endsWith(".local"))document.documentElement.setAttribute("data-local","1")}catch(e){}})();
    </script>
    <link rel="stylesheet" href="theme.css">
    <title>Kyle Elliott Mathewson</title>
    <meta name="description" content="Kyle Mathewson — psychology, portable brain sensing, teaching, papers, and projects.">
    <style>
        :root {
            --bg:#0a0a0b;
            --bg-grad: radial-gradient(1100px 560px at 72% -12%, #16161b 0%, #0a0a0b 62%);
            --surface:#151518; --surface-2:#1c1c20; --surface-3:#26262c;
            --border:#2a2a31; --border-strong:#3b3b44;
            --text:#f5f5f6; --text-dim:#b6b6bf; --text-faint:#7c7c87;
            --accent:#6ea8fe; --radius:12px;
            --shadow:0 10px 32px rgba(0,0,0,.5);
            --card-w: 210px; --shot-h: 124px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); background-image: var(--bg-grad); background-attachment: fixed;
            color: var(--text); -webkit-font-smoothing: antialiased;
        }
        a { color: var(--accent); }
        .wrap { max-width: 1640px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 48px) 64px; }
        .identity { display: flex; gap: 22px; align-items: flex-start; margin-bottom: 18px; }
        .identity img { width: 92px; height: 92px; object-fit: cover; border-radius: 14px; flex-shrink: 0; display: block; }
        a.home { color: inherit; text-decoration: none; cursor: pointer; }
        a.home:hover { opacity: 0.82; }
        h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 4px; }
        .role { color: var(--text-dim); margin: 0 0 8px; font-size: 14px; }
        .about { margin: 0; color: var(--text-dim); font-size: 14.5px; line-height: 1.5; max-width: 760px; }
        .meta { margin-top: 8px; color: var(--text-faint); font-size: 13px; }
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 18px 0 12px; }
        .search { flex: 1; min-width: 220px; }
        .search input, .sort select {
            width: 100%; background: var(--surface); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; font-size: 14px; outline: none;
        }
        .search input:focus, .sort select:focus { border-color: var(--accent); }
        .sort, .size { display: flex; align-items: center; gap: 8px; color: var(--text-faint); font-size: 12.5px; }
        .sort select { width: auto; padding: 8px 10px; }
        .size input { width: 120px; accent-color: var(--accent); }
        .views { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
        .views button, .fchip {
            border: 0; background: transparent; color: var(--text-dim); cursor: pointer;
            border-radius: 8px; font-weight: 600;
        }
        .views button { padding: 7px 12px; font-size: 13px; }
        .views button.active { background: var(--surface-3); color: var(--text); }
        a.edit { display: none; color: var(--text-dim); font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
        html[data-local] a.edit { display: inline-block; }
        a.edit:hover { color: var(--text); border-color: var(--border-strong); }
        .table-wrap { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
        table.data { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        table.data th { background: var(--surface-2); color: var(--text-dim); text-align: left; font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
        table.data th:hover { color: var(--text); }
        table.data th.on::after { content: ' ↑'; color: var(--accent); }
        table.data th.on.desc::after { content: ' ↓'; }
        table.data td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-dim); }
        table.data tr { cursor: pointer; }
        table.data tr:hover { background: var(--surface-2); }
        table.data td.title { color: var(--text); font-weight: 600; }
        table.data td, table.data th { overflow-wrap: anywhere; }
        table.data td.desc { color: var(--text-faint); }
        .card-grid { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
        .more { margin-top: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); border-radius: 999px; padding: 7px 14px; font-weight: 650; font-size: 13px; cursor: pointer; }
        .more:hover { color: var(--text); border-color: var(--border-strong); }
        .chip-board { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .chip-level { display: flex; gap: 12px; align-items: flex-start; }
        .chip-label { flex: 0 0 76px; padding-top: 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
        .chip-row, .chip-groups { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; min-width: 0; }
        .chip-groups { gap: 8px 10px; }
        .chip-group {
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
            padding: 4px 6px 4px 8px; border-radius: 12px;
            background: color-mix(in srgb, var(--tint) 9%, transparent);
        }
        .group-name { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--tint); opacity: .8; margin-right: 2px; }
        .fchip {
            border: 1px solid color-mix(in srgb, var(--tint, var(--border)) 45%, var(--border));
            background: color-mix(in srgb, var(--tint, var(--surface)) 16%, var(--surface));
            color: var(--text-dim); padding: 6px 12px; border-radius: 999px; font-size: 12.5px;
        }
        .fchip .n { opacity: .65; font-weight: 550; margin-left: 2px; }
        .fchip.section { font-size: 13px; padding: 7px 13px; }
        .fchip.topic { font-size: 12px; padding: 5px 10px; }
        .fchip:hover { color: var(--text); border-color: color-mix(in srgb, var(--tint) 70%, var(--border-strong)); }
        .fchip.active { background: var(--tint, var(--text)); color: #0a0a0b; border-color: transparent; }
        .fchip.active:hover { color: #0a0a0b; }
        .focus-banner { display: flex; gap: 18px; align-items: flex-start; margin: 0 0 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
        .focus-banner img { width: 148px; height: 96px; object-fit: cover; border-radius: 10px; flex-shrink: 0; background: var(--surface-3); }
        .focus-banner h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.02em; }
        .focus-banner p { margin: 0; color: var(--text-dim); font-size: 14.5px; line-height: 1.5; max-width: 760px; }
        .places { display: flex; flex-wrap: wrap; gap: 8px 2px; margin: 4px 0 2px; }
        .place {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            width: 62px; text-decoration: none; color: var(--text-dim);
        }
        .place .orb {
            width: 34px; height: 34px; border-radius: 50%; background: #fff;
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            overflow: hidden; transition: transform .18s ease, border-color .18s ease;
        }
        .place img { width: 54%; height: 54%; object-fit: contain; display: block; }
        .place.wide img { width: 84%; height: 84%; }
        .place .label { font-size: 10px; font-weight: 650; letter-spacing: -0.01em; text-align: center; line-height: 1.15; }
        .place:hover .orb { transform: translateY(-2px); border-color: var(--border-strong); }
        .place:hover, .place:hover .label { color: var(--text); }
        .interests { margin: 2px 0 6px; padding: 14px 0 10px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .interests-label { margin: 0 0 10px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
        .area-strip { display: flex; flex-wrap: wrap; gap: 6px 10px; }
        .area-card {
            flex: 0 0 auto;
            display: flex; align-items: center; gap: 10px;
            padding: 3px 12px 3px 3px; border-radius: 999px;
            text-decoration: none; color: inherit; background: transparent;
        }
        .area-card img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; display: block; background: var(--surface-3); }
        .area-card span { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; white-space: nowrap; }
        .area-card:hover { background: var(--surface); }
        .area-card:hover span { color: var(--accent); }
        .area-card.on { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); }
        .area-card.dim { opacity: 0.38; filter: grayscale(1); }
        .area-card.dim:hover { opacity: 0.72; }
        .row { margin: 0 0 26px; }
        .row-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
        .row-head h2 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .row-head h2::before { content: ''; width: 8px; height: 8px; border-radius: 3px; background: var(--dot, var(--text-faint)); }
        .row-head h2 a { color: inherit; text-decoration: none; }
        .row-head h2 a:hover { color: var(--accent); }
        .count { font-size: 12px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
        .row-desc { margin: 0 0 10px; color: var(--text-dim); font-size: 13.5px; line-height: 1.45; max-width: 820px; }
        .card {
            width: min(var(--card-w), 100%); flex: 0 1 auto;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; cursor: pointer; text-decoration: none; color: inherit;
            display: flex; flex-direction: column;
            transition: transform .18s ease, border-color .18s ease, background .18s ease;
        }
        .card:hover { transform: translateY(-3px); background: var(--surface-2); border-color: var(--border-strong); box-shadow: var(--shadow); }
        .shot { height: var(--shot-h); max-height: var(--shot-h); flex: 0 0 var(--shot-h); background: var(--surface-3); position: relative; overflow: hidden; }
        .shot img.cover { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
        .mark {
            height: 100%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 700; color: white; letter-spacing: -0.03em;
        }
        .mark img.logo { width: 42%; height: 42%; object-fit: contain; }
        .paper-shot { display: grid; grid-template-columns: 1.25fr 0.9fr; grid-template-rows: minmax(0, 1fr); height: 100%; max-height: 100%; min-height: 0; overflow: hidden; background: #f4f1ea; color: #1c1c1c; }
        .paper-page { padding: 22px 8px 6px; overflow: hidden; border-right: 1px solid #e4dfd4; min-height: 0; min-width: 0; }
        .paper-page img.cover { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
        .paper-page .kicker { font-size: 7px; letter-spacing: .08em; text-transform: uppercase; color: #887f70; margin-bottom: 4px; }
        .paper-page .pt { font-family: Georgia, 'Times New Roman', serif; font-size: 9px; line-height: 1.2; font-weight: 700; margin: 0 0 3px; }
        .paper-page .pa { font-size: 7px; color: #5c564c; margin-bottom: 5px; }
        .paper-page .lines { display: flex; flex-direction: column; gap: 3px; }
        .paper-page .lines span { display: block; height: 3px; background: #e4dfd4; border-radius: 1px; }
        .paper-figs { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 3px; padding: 3px; background: #fff; min-height: 0; min-width: 0; overflow: hidden; }
        .paper-figs img, .paper-figs .fig {
            width: 100%; height: 100%; min-height: 0; object-fit: cover; background: #f7f5f0; border: 1px solid #e7e1d6;
        }
        .paper-figs .fig { display: flex; align-items: flex-end; padding: 4px; font-size: 8px; color: #887f70; }
        .info { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 4px; height: 78px; overflow: hidden; }
        .info h3 { margin: 0; font-size: 13.5px; font-weight: 650; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .info p { margin: 0; color: var(--text-faint); font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .kind {
            position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700;
            letter-spacing: .04em; text-transform: uppercase; background: rgba(0,0,0,.55);
            border: 1px solid var(--border); color: white; border-radius: 6px; padding: 2px 6px;
        }
        .empty { color: var(--text-faint); font-size: 14px; }
        footer { margin-top: 12px; color: var(--text-faint); font-size: 12px; }
        @media (max-width: 640px) {
            .identity { flex-direction: column; }
            .chip-level { flex-direction: column; gap: 6px; }
            .chip-label { padding-top: 0; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <header class="identity" id="identity"></header>
    <div id="places"></div>
    <div id="areas"></div>
    <div id="focus"></div>
    <div class="controls">
        <div class="search"><input id="q" type="search" placeholder="Search projects, papers, courses, links…"></div>
        <label class="size">Card size
            <input id="card-size" type="range" min="140" max="340" value="210">
        </label>
        <label class="sort">Sort
            <select id="sort">
                <option value="recent">Recent</option>
                <option value="name">Name</option>
                <option value="year">Year</option>
            </select>
        </label>
        <div class="views">
            <button type="button" data-view="rows" class="active">Rows</button>
            <button type="button" data-view="cards">Cards</button>
            <button type="button" data-view="table">Table</button>
        </div>
        <a class="edit" href="sorter.html">Edit categories</a>
        <a class="edit" href="screenshots.html">Add screenshots</a>
        <a class="edit" href="paper-shots.html">Add paper images</a>
    </div>
    <div class="chip-board" id="chips"></div>
    <main id="catalogue"></main>
    <footer id="foot"></footer>
</div>
<script>
const PREVIEW = 10;
const state = { q: '', sort: 'recent', view: 'rows', kind: 'all', topic: 'all', area: null, areaTopics: null, itemTopics: new Map(), rows: [], areas: [], links: [], open: new Set(), tableKey: 'title', tableDir: 1 };
const TYPE_IDS = new Set(['links', 'papers', 'news', 'writing', 'experience']);
const KIND_CHIPS = [
    {id: 'all', title: 'All', tint: '#f5f5f6'},
    {id: 'project', title: 'Projects', tint: '#8eb0ff'},
    {id: 'paper', title: 'Papers', tint: '#e0a35e'},
    {id: 'writing', title: 'Writing', tint: '#b48ef0'},
    {id: 'news', title: 'News', tint: '#6cc6d6'}
];
const TOPIC_FAMILIES = [
    { title: 'Lab', tint: '#5ec98b', keys: ['teaching', 'research', 'flexibleelectronics'] },
    { title: 'Perception', tint: '#c4a6f5', keys: ['illusions', 'artcolabs'] },
    { title: 'Brain tools', tint: '#8eb0ff', keys: ['webeeg', 'eegtools'] },
    { title: 'Math & machines', tint: '#e0b56a', keys: ['math', 'magicsquares', 'computingscience', 'deeplearningpages', 'generativeai', 'computationalinteligence'] },
    { title: 'Web & making', tint: '#7dcaa3', keys: ['webosapps', 'webanimation', 'webtools', 'commandlinetools', '3dprint', 'games', 'scratch'] },
    { title: 'Elsewhere', tint: '#7dccc4', keys: ['soccer', 'judaism', 'finances', 'consulting', 'productivity'] }
];
const OTHER_FAMILY = { title: 'Other', tint: '#9aa0aa' };
function familyKey(title) {
    return String(title || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}
function familyFor(title) {
    const key = familyKey(title);
    return TOPIC_FAMILIES.find(f => f.keys.includes(key)) || OTHER_FAMILY;
}
function chipTint(row, family) {
    const own = row && row.color;
    if (own && own.toLowerCase() !== '#9aa0aa') return own;
    return family.tint;
}

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stamp(item) {
    const raw = item.lastCommit || item.createdAt || item.year || 0;
    const n = Date.parse(raw);
    if (!Number.isNaN(n)) return n;
    const y = Number(item.year);
    return y ? Date.UTC(y, 0, 1) : 0;
}
function sortItems(items) {
    const copy = items.slice();
    if (state.sort === 'name') copy.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    else if (state.sort === 'year') copy.sort((a, b) => (b.year || 0) - (a.year || 0) || (a.title || '').localeCompare(b.title || ''));
    else copy.sort((a, b) => stamp(b) - stamp(a));
    return copy;
}
function matches(item) {
    if (!state.q) return true;
    const hay = [item.title, item.oneLiner, item.authors, item.kind, ...(item.categories || []), ...(item.tags || [])].join(' ').toLowerCase();
    return hay.includes(state.q);
}
function resourceKind(item) {
    if (item.kind === 'paper') return 'paper';
    if (item.kind === 'news') return 'news';
    if (item.kind === 'link') return 'link';
    if (item.kind === 'longform') return 'writing';
    if (item.kind === 'topic') return 'focus';
    return 'project';
}
function topicsOf(item) {
    return state.itemTopics.get(String(item.id).toLowerCase()) || new Set();
}
function inArea(item) {
    if (!state.areaTopics) return true;
    let hit = false;
    topicsOf(item).forEach(id => { if (state.areaTopics.has(id)) hit = true; });
    return hit;
}
function inScope(item) {
    if (resourceKind(item) === 'focus' || resourceKind(item) === 'link') return false;
    if (!inArea(item)) return false;
    if (state.kind !== 'all' && resourceKind(item) !== state.kind) return false;
    if (state.topic !== 'all' && !topicsOf(item).has(state.topic)) return false;
    return matches(item);
}
function paperShot(item) {
    const figs = item.figures || [];
    const page = item.pdfPage
        ? `<img class="cover" src="${esc(item.pdfPage)}" alt="">`
        : `<div class="kicker">${esc(item.year || 'Paper')}</div><p class="pt">${esc(item.title)}</p><div class="pa">${esc(item.authors || '')}</div><div class="lines"><span></span><span style="width:92%"></span><span style="width:80%"></span><span></span><span style="width:88%"></span><span style="width:70%"></span></div>`;
    const fig = (src, label) => src
        ? `<img src="${esc(src)}" alt="${esc(label)}">`
        : `<div class="fig">${esc(label)}</div>`;
    if (item.composite) return `<img class="cover" src="${esc(item.composite)}" alt="">`;
    return `<div class="paper-shot"><div class="paper-page">${page}</div><div class="paper-figs">${fig(figs[0], 'Fig. 1')}${fig(figs[1], 'Fig. 2')}</div></div>`;
}
function shot(item) {
    if (item.kind === 'paper') return paperShot(item);
    if (item.screenshot) return `<img class="cover" src="${esc(item.screenshot)}" alt="">`;
    const accent = item.accent || '#3b3b44';
    const mark = item.logo
        ? `<img class="logo" src="${esc(item.logo)}" alt="">`
        : esc(item.mark || (item.title || '?').slice(0, 2));
    return `<div class="mark" style="background:${esc(accent)}">${mark}</div>`;
}
function card(item) {
    const href = item.demoUrl || item.url || item.githubUrl || '#';
    const extra = item.kind === 'paper' ? ' paper' : '';
    return `<a class="card${extra}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">
        <div class="shot">${shot(item)}<span class="kind">${esc(item.kind || 'project')}</span></div>
        <div class="info"><h3>${esc(item.title)}</h3><p>${esc(item.oneLiner || '')}</p></div>
    </a>`;
}
function visibleItems(items) {
    return sortItems(items.filter(inScope));
}
function topicRows() {
    return state.rows.filter(row => !TYPE_IDS.has(row.id) && (state.topic === 'all' || row.id === state.topic));
}
function looseItems() {
    if (state.topic !== 'all') return [];
    const placed = new Set();
    state.rows.forEach(row => {
        if (TYPE_IDS.has(row.id)) return;
        row.items.forEach(item => placed.add(String(item.id).toLowerCase()));
    });
    const out = [];
    const seen = new Set();
    state.rows.forEach(row => {
        if (!TYPE_IDS.has(row.id)) return;
        row.items.forEach(item => {
            const key = String(item.id).toLowerCase();
            if (placed.has(key) || seen.has(key) || !inScope(item)) return;
            seen.add(key);
            out.push({...item, category: row.title});
        });
    });
    return sortItems(out);
}
function collectedItems(activeRows) {
    const items = [];
    const seen = new Set();
    activeRows.forEach(row => visibleItems(row.items).forEach(item => {
        if (seen.has(item.id)) return;
        seen.add(item.id);
        items.push({...item, category: row.title});
    }));
    return items;
}
function tableValue(item, key) {
    if (key === 'updated') return stamp(item);
    if (key === 'year') return item.year || 0;
    return String(item[key] || '').toLowerCase();
}
function selectionItems() {
    const items = [];
    const seen = new Set();
    state.rows.forEach(row => row.items.forEach(item => {
        const key = String(item.id).toLowerCase();
        if (seen.has(key) || resourceKind(item) === 'focus' || resourceKind(item) === 'link') return;
        if (state.kind !== 'all' && resourceKind(item) !== state.kind) return;
        if (state.topic !== 'all' && !topicsOf(item).has(state.topic)) return;
        if (!matches(item)) return;
        seen.add(key);
        items.push(item);
    }));
    return items;
}
function visibleAreas() {
    if (state.topic === 'all') return state.areas;
    const present = new Set();
    selectionItems().forEach(item => topicsOf(item).forEach(id => present.add(id)));
    return state.areas.filter(area => (area.topics || []).some(id => present.has(id)));
}
const WIDE_LINKS = new Set(['link-lab']);
function placesHtml() {
    if (!state.links.length) return '';
    return `<div class="places">${state.links.map(item => {
        const href = item.url || item.demoUrl || '#';
        const wide = WIDE_LINKS.has(item.id) ? ' wide' : '';
        const icon = item.logo
            ? `<img src="${esc(item.logo)}" alt="">`
            : esc(item.mark || (item.title || '?').slice(0, 2));
        return `<a class="place${wide}" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><span class="orb">${icon}</span><span class="label">${esc(item.title)}</span></a>`;
    }).join('')}</div>`;
}
function renderPlaces() {
    document.getElementById('places').innerHTML = placesHtml();
}
function areasHtml() {
    const areas = visibleAreas();
    if (!areas.length) return '';
    return `<div class="interests"><p class="interests-label">Areas of interest</p><div class="area-strip">${areas.map(area => {
        const on = state.area && state.area.id === area.id;
        const dim = state.area && !on ? ' dim' : '';
        return `<a class="area-card${on ? ' on' : ''}${dim}" data-area="${esc(area.id)}" href="?area=${encodeURIComponent(area.id)}">${area.logo ? `<img src="${esc(area.logo)}" alt="">` : ''}<span>${esc(area.title)}</span></a>`;
    }).join('')}</div></div>`;
}
function applyArea(area, push) {
    state.area = area || null;
    state.areaTopics = state.area ? new Set(state.area.topics || []) : null;
    document.title = state.area ? `${state.area.title} — Kyle Elliott Mathewson` : 'Kyle Elliott Mathewson';
    const url = new URL(location.href);
    if (state.area) url.searchParams.set('area', state.area.id);
    else url.searchParams.delete('area');
    const next = url.pathname + url.search + url.hash;
    if (push && next !== location.pathname + location.search + location.hash) history.pushState({area: state.area && state.area.id}, '', next);
    renderFocus();
    renderChips();
    render();
}
function renderAreas() {
    document.getElementById('areas').innerHTML = areasHtml();
}
function cardBlock(rowId, items) {
    const open = state.open.has(rowId);
    const shown = open ? items : items.slice(0, PREVIEW);
    const toggle = items.length > PREVIEW
        ? `<button type="button" class="more" data-row="${esc(rowId)}">${open ? 'Hide' : 'Show all'}</button>`
        : '';
    return `<div class="card-grid">${shown.map(card).join('')}</div>${toggle}`;
}
function render() {
    renderAreas();
    const root = document.getElementById('catalogue');
    const activeRows = topicRows().filter(row => visibleItems(row.items).length);
    const loose = looseItems();
    if (state.view === 'cards' || state.view === 'table') {
        let items = collectedItems(activeRows).concat(loose);
        if (state.view === 'table') {
            items.sort((a, b) => {
                const av = tableValue(a, state.tableKey);
                const bv = tableValue(b, state.tableKey);
                if (av < bv) return -1 * state.tableDir;
                if (av > bv) return 1 * state.tableDir;
                return 0;
            });
            const cols = [
                ['title', 'Title'], ['kind', 'Kind'], ['category', 'Category'],
                ['oneLiner', 'Description'], ['year', 'Year'], ['updated', 'Updated']
            ];
            root.innerHTML = items.length ? `<div class="table-wrap"><table class="data"><thead><tr>${cols.map(([key, label]) => {
                const on = state.tableKey === key ? ` on${state.tableDir < 0 ? ' desc' : ''}` : '';
                return `<th data-key="${key}" class="${on.trim()}">${label}</th>`;
            }).join('')}</tr></thead><tbody>${items.map(item => `<tr data-href="${esc(item.demoUrl || item.url || item.githubUrl || '')}">
                <td class="title">${esc(item.title)}</td>
                <td>${esc(item.kind || '')}</td>
                <td>${esc(item.category || '')}</td>
                <td class="desc">${esc(item.oneLiner || '')}</td>
                <td>${esc(item.year || '')}</td>
                <td>${item.lastCommit ? esc(String(item.lastCommit).slice(0, 10)) : esc(item.year || '')}</td>
            </tr>`).join('')}</tbody></table></div>` : `<p class="empty">Nothing matches.</p>`;
            return;
        }
        root.innerHTML = items.length
            ? cardBlock('cards', items)
            : `<p class="empty">Nothing matches.</p>`;
        return;
    }
    const html = activeRows.map(row => {
        const items = visibleItems(row.items);
        if (!items.length) return '';
        return `<section class="row">
            <div class="row-head"><h2 style="--dot:${esc(row.color)}">${esc(row.title)}</h2><span class="count">${items.length}</span></div>
            ${row.description ? `<p class="row-desc">${esc(row.description)}</p>` : ''}
            ${cardBlock(row.id, items)}
        </section>`;
    }).join('');
    const looseHtml = loose.length ? `<section class="row">
        <div class="row-head"><h2 style="--dot:#9aa0aa">${state.kind === 'all' ? 'Also' : esc(KIND_CHIPS.find(k => k.id === state.kind).title)}</h2><span class="count">${loose.length}</span></div>
        ${cardBlock('loose', loose)}
    </section>` : '';
    root.innerHTML = html + looseHtml || `<p class="empty">Nothing matches.</p>`;
}
function renderIdentity(profile) {
    document.getElementById('identity').innerHTML = `
        <a class="home" href="./" title="Back to the start"><img src="${esc(profile.headshot)}" alt=""></a>
        <div>
            <h1><a class="home" href="./" title="Back to the start">${esc(profile.name)}</a></h1>
            <p class="role">${esc(profile.role)}</p>
            <p class="about">${esc(profile.about)}</p>
            <p class="meta">${esc(profile.office)} · <a href="mailto:${esc(profile.email)}">${esc(profile.email)}</a></p>
        </div>`;
}
function countKind(kind) {
    const seen = new Set();
    let n = 0;
    state.rows.forEach(row => row.items.forEach(item => {
        const key = String(item.id).toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        if (resourceKind(item) === 'focus' || resourceKind(item) === 'link' || !inArea(item)) return;
        if (kind !== 'all' && resourceKind(item) !== kind) return;
        n += 1;
    }));
    return n;
}
function renderFocus() {
    const el = document.getElementById('focus');
    if (!state.area) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="focus-banner">${state.area.logo ? `<img src="${esc(state.area.logo)}" alt="">` : ''}<div><h2>${esc(state.area.title)}</h2><p>${esc(state.area.summary || '')}</p></div></div>`;
}
function renderChips() {
    const kinds = KIND_CHIPS.filter(k => k.id === 'all' || countKind(k.id)).map(k => {
        const on = state.kind === k.id ? ' active' : '';
        return `<button type="button" class="fchip section${on}" style="--tint:${esc(k.tint)}" data-kind="${esc(k.id)}">${esc(k.title)}<span class="n">${countKind(k.id)}</span></button>`;
    });
    const savedKind = state.kind;
    const savedTopic = state.topic;
    state.topic = 'all';
    const topics = state.rows.filter(row => !TYPE_IDS.has(row.id)).map(row => {
        const n = visibleItems(row.items).length;
        return n ? {row, n} : null;
    }).filter(Boolean);
    state.kind = savedKind;
    state.topic = savedTopic;
    const buckets = TOPIC_FAMILIES.map(f => ({...f, chips: []}));
    const other = {...OTHER_FAMILY, chips: []};
    topics.forEach(({row, n}) => {
        const family = familyFor(row.title);
        const bucket = buckets.find(b => b.title === family.title) || other;
        bucket.chips.push({row, n, tint: chipTint(row, family)});
    });
    const groups = buckets.concat([other]).filter(b => b.chips.length);
    const allButton = `<button type="button" class="fchip topic${state.topic === 'all' ? ' active' : ''}" style="--tint:#f5f5f6" data-topic="all">All</button>`;
    const groupHtml = groups.map(g => `<div class="chip-group" style="--tint:${esc(g.tint)}"><span class="group-name">${esc(g.title)}</span>${g.chips.map(({row, n, tint}) => `<button type="button" class="fchip topic${state.topic === row.id ? ' active' : ''}" style="--tint:${esc(tint)}" data-topic="${esc(row.id)}">${esc(row.title)}<span class="n">${n}</span></button>`).join('')}</div>`).join('');
    document.getElementById('chips').innerHTML = `
        <div class="chip-level"><span class="chip-label">Type</span><div class="chip-row">${kinds.join('')}</div></div>
        <div class="chip-level"><span class="chip-label">Topics</span><div class="chip-groups">${allButton}${groupHtml}</div></div>`;
}
function byId(list) {
    const map = new Map();
    list.forEach(item => map.set(String(item.id).toLowerCase(), item));
    return map;
}

Promise.all([
    fetch('site_content.json').then(r => r.json()),
    fetch('catalogue_data.json').then(r => r.json())
]).then(([site, catalogue]) => {
    const projects = (catalogue.items || []).map(item => ({...item, kind: item.kind || 'project', url: item.demoUrl || item.githubUrl}));
    const projectMap = byId(projects);
    state.areas = site.areas || [];
    state.links = site.links || [];
    const topicMap = new Map();
    (site.categories || []).forEach(c => {
        if (TYPE_IDS.has(c.id) || c.id === 'general') return;
        (c.names || []).forEach(n => {
            const key = String(n).toLowerCase();
            if (!topicMap.has(key)) topicMap.set(key, new Set());
            topicMap.get(key).add(c.id);
        });
    });
    state.itemTopics = topicMap;
    const areaId = new URLSearchParams(location.search).get('area');
    state.area = state.areas.find(a => a.id === areaId) || null;
    state.areaTopics = state.area ? new Set(state.area.topics || []) : null;
    if (state.area) document.title = `${state.area.title} — Kyle Elliott Mathewson`;
    const local = [...site.links, ...site.teaching, ...site.experience, ...site.stages, ...site.papers, ...site.news];
    const localMap = byId(local);
    const allItems = new Map([...projectMap, ...localMap]);
    const usedGroups = new Set();
    const usedProjects = new Set();
    if (Array.isArray(site.categories) && site.categories.length) {
        const known = new Set();
        state.rows = site.categories.filter(c => c.id !== 'general').map(c => {
            const items = (c.names || []).map(n => allItems.get(String(n).toLowerCase())).filter(Boolean);
            items.forEach(item => known.add(String(item.id).toLowerCase()));
            return {id: c.id, title: c.title, description: c.description || '', color: c.color || '#9aa0aa', items};
        });
        const general = site.categories.find(c => c.id === 'general');
        const loose = (general ? general.names : []).map(n => allItems.get(String(n).toLowerCase())).filter(Boolean);
        projects.forEach(item => { if (!known.has(String(item.id).toLowerCase())) loose.push(item); });
        const seenLoose = new Set();
        const extra = loose.filter(item => {
            const key = String(item.id).toLowerCase();
            if (known.has(key) || seenLoose.has(key)) return false;
            seenLoose.add(key);
            return true;
        });
        if (extra.length) {
            state.rows.push({id: 'general', title: (general && general.title) || 'More projects', description: (general && general.description) || '', color: '#9aa0aa', items: extra});
        }
        renderIdentity(site.profile);
        renderPlaces();
        renderFocus();
        renderChips();
        render();
        const when = catalogue.generatedAt ? new Date(catalogue.generatedAt).toLocaleDateString() : '';
        document.getElementById('foot').textContent = when ? `Project cards refresh from GitHub. Catalogue generated ${when}.` : '';
        return;
    }

    function takeGroup(groupId) {
        const group = (site.groups || []).find(g => g.id === groupId);
        if (!group) return [];
        usedGroups.add(groupId);
        return (group.names || []).map(name => {
            const item = projectMap.get(String(name).toLowerCase());
            if (!item) return null;
            usedProjects.add(item.id);
            return item;
        }).filter(Boolean);
    }

    state.rows = site.featured.map(row => {
        const items = [];
        (row.itemIds || []).forEach(id => { const item = localMap.get(id.toLowerCase()); if (item) items.push(item); });
        (row.groupIds || []).forEach(id => items.push(...takeGroup(id)));
        if (row.kinds) {
            const kinds = new Set(row.kinds);
            local.filter(item => kinds.has(item.kind)).forEach(item => items.push(item));
            projects.filter(item => kinds.has(item.kind)).forEach(item => { usedProjects.add(item.id); items.push(item); });
        }
        const seen = new Set();
        return {...row, items: items.filter(item => item && !seen.has(item.id) && seen.add(item.id))};
    });

    (site.groups || []).forEach(group => {
        if (usedGroups.has(group.id)) return;
        const items = takeGroup(group.id);
        if (!items.length) return;
        state.rows.push({id: group.id, title: group.title, description: group.description || '', color: '#9aa0aa', items});
    });

    const rest = projects.filter(item => !usedProjects.has(item.id));
    if (rest.length) {
        state.rows.push({id:'more', title:'More projects', description:'Public repositories that are not in a category yet.', color:'#9aa0aa', items: rest});
    }

    renderIdentity(site.profile);
    renderPlaces();
    renderFocus();
    renderChips();
    render();
    const when = catalogue.generatedAt ? new Date(catalogue.generatedAt).toLocaleDateString() : '';
    document.getElementById('foot').textContent = when ? `Project cards refresh from GitHub. Catalogue generated ${when}.` : '';
}).catch(err => {
    document.getElementById('catalogue').innerHTML = `<p class="empty">Could not load the catalogue.</p>`;
    console.error(err);
});

document.getElementById('identity').addEventListener('click', e => {
    const home = e.target.closest('a.home');
    if (!home) return;
    e.preventDefault();
    const start = new URL('./', location.href);
    const here = new URL(location.href);
    if (start.pathname === here.pathname && !here.search && !here.hash) location.reload();
    else location.assign(start.href);
});
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
document.querySelector('.views').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state.view = btn.dataset.view;
    document.querySelectorAll('.views button').forEach(b => b.classList.toggle('active', b === btn));
    render();
});
function applyCardSize(px) {
    const width = Math.max(140, Math.min(340, Number(px) || 210));
    document.documentElement.style.setProperty('--card-w', width + 'px');
    document.documentElement.style.setProperty('--shot-h', Math.round(width * 124 / 210) + 'px');
    try { localStorage.setItem('homepage-card-size', String(width)); } catch (err) {}
}
const savedSize = (() => { try { return localStorage.getItem('homepage-card-size'); } catch (err) { return null; } })();
if (savedSize) {
    document.getElementById('card-size').value = savedSize;
    applyCardSize(savedSize);
}
document.getElementById('card-size').addEventListener('input', e => applyCardSize(e.target.value));
document.getElementById('catalogue').addEventListener('click', e => {
    const more = e.target.closest('button.more');
    if (more) {
        const id = more.dataset.row;
        if (state.open.has(id)) state.open.delete(id);
        else state.open.add(id);
        render();
        return;
    }
    const th = e.target.closest('th[data-key]');
    if (th) {
        const key = th.dataset.key;
        state.tableDir = state.tableKey === key ? -state.tableDir : 1;
        state.tableKey = key;
        render();
        return;
    }
    const tr = e.target.closest('tr[data-href]');
    if (tr && tr.dataset.href) window.open(tr.dataset.href, '_blank', 'noopener');
});
document.getElementById('areas').addEventListener('click', e => {
    const card = e.target.closest('.area-card');
    if (!card) return;
    e.preventDefault();
    const area = state.areas.find(a => a.id === card.dataset.area);
    if (!area) return;
    applyArea(state.area && state.area.id === area.id ? null : area, true);
});
window.addEventListener('popstate', () => {
    const areaId = new URLSearchParams(location.search).get('area');
    applyArea(state.areas.find(a => a.id === areaId) || null, false);
});
document.getElementById('chips').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.kind) {
        state.kind = btn.dataset.kind;
        state.topic = 'all';
    } else if (btn.dataset.topic) {
        state.topic = btn.dataset.topic;
    }
    renderChips();
    render();
});
</script>
<script src="theme.js"></script>
